# Which JDK the Gradle *daemon* itself runs on -- not the toolchain the code is
# compiled with, which build.gradle.kts sets separately.
#
# It has to be pinned because KSP loads :codegen into a worker inside the daemon
# JVM, so the daemon must be new enough to read the class file version :codegen
# emits. Left to itself the daemon inherits whatever JAVA_HOME the caller had,
# which for anyone running a JDK switcher is a coin flip -- an older JAVA_HOME
# fails :kspKotlin with "compiled by a more recent version of the Java Runtime".
#
# The toolchainUrl lines let Gradle fetch a matching JDK where none is
# installed. Regenerate the whole file with:
#
#     ./gradlew updateDaemonJvm --jvm-version=<N>
#
toolchainUrl.FREE_BSD.AARCH64=https\://api.foojay.io/disco/v3.0/ids/539ea72837c6244075f8ee037babc29e/redirect
toolchainUrl.FREE_BSD.X86_64=https\://api.foojay.io/disco/v3.0/ids/876dbbf00bf4ef6190f7da074cee903a/redirect
