#[package]
#name = "kitsune-app"
#version = "0.1.0"
#description = "A Tauri App"
#authors = ["you"]
#edition = "2021"
#
## See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
#[lib]
## The `_lib` suffix may seem redundant but it is necessary
## to make the lib name unique and wouldn't conflict with the bin name.
## This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
#name = "kitsune_app_lib"
#crate-type = ["staticlib", "cdylib", "rlib"]
#
#[build-dependencies]
#tauri-build = { version = "2", features = [] }
#
#[dependencies]
#tauri = { version = "2", features = [] }
#tauri-plugin-opener = "2"
#serde = { version = "1", features = ["derive"] }
#serde_json = "1"
#
[package]
name = "kitsune"
version = "0.1.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kitsune_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
jni = { version = "0.22.4", features = ["invocation"] }
anyhow = "1.0.104"
zstd = "0.13.3"
dirs = "6.0.0"
tar = { version = "0.4.46", default-features = false }
rustc-hash = "2.1.3"
parking_lot = "0.12.5"

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
blake3 = "1.8.7"
tar = { version = "0.4.46", default-features = false }
zstd = "0.13.3"
tauri-build = { version = "2", features = [] }

# Only the build script uses this, and only on Windows, where the Gradle wrapper
# has to be launched with an explicit inherited-handle list so the daemon does
# not end up holding Cargo's pipes. See build/spawn.rs.
#
# Gated so it is resolved only where it is needed. Note the cfg here is matched
# against the *host*, not `--target`, because that is where a build script runs:
# building for Linux from a Windows box still pulls this in, and someone on a
# Linux or macOS host never sees it at all. That is the right way round — the
# Unix half of spawn.rs is a plain std Command and needs nothing.
#
# The version is already in the lock file by way of tauri, so this adds no new
# package to the tree.
[target.'cfg(windows)'.build-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
